name: Render public site
on:
  push:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Live site URL (empty serves ./site locally)'
        required: false
        type: string
        default: ''
permissions:
  contents: read
jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node shoot.mjs
        env:
          BASE_URL: ${{ inputs.base_url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: render-${{ github.sha }}
          path: out/
