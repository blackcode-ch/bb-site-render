name: Render locked team form
on:
  push:
    branches: ['review/equipe-locked-20261109']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  equipe:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node equipe-check.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: equipe-locked
          path: out/
